version: 1.0.0
dataset: bybit_earn_yield
description: Raw earn yield history from Bybit crypto platform
owner: finance-analytics-team
domain: crypto
source_system: Bybit
format: CSV
delimiter: ","
encoding: utf-8
skip_header_rows: 0
skip_footer_rows: 0

target_table:
  schema: prod_raw
  name: bybit_earn_yield

columns:
  - name: 'amount'
    type: varchar
    nullable: true
    description: 'Raw amount value from Bybit earn yield export'
    source_column_index: 0

  - name: 'coin'
    type: varchar
    nullable: true
    description: 'Raw coin value from Bybit earn yield export'
    source_column_index: 1

  - name: 'createdAt'
    type: varchar
    nullable: true
    description: 'Raw createdAt value from Bybit earn yield export'
    source_column_index: 2

  - name: 'distributionMode'
    type: varchar
    nullable: true
    description: 'Raw distributionMode value from Bybit earn yield export'
    source_column_index: 3

  - name: 'effectiveStakingAmount'
    type: varchar
    nullable: true
    description: 'Raw effectiveStakingAmount value from Bybit earn yield export'
    source_column_index: 4

  - name: 'id'
    type: varchar
    nullable: true
    description: 'Raw id value from Bybit earn yield export'
    source_column_index: 5

  - name: 'orderId'
    type: varchar
    nullable: true
    description: 'Raw orderId value from Bybit earn yield export'
    source_column_index: 6

  - name: 'price_usd'
    type: varchar
    nullable: true
    description: 'Raw price_usd value from Bybit earn yield export'
    source_column_index: 7

  - name: 'productId'
    type: varchar
    nullable: true
    description: 'Raw productId value from Bybit earn yield export'
    source_column_index: 8

  - name: 'status'
    type: varchar
    nullable: true
    description: 'Raw status value from Bybit earn yield export'
    source_column_index: 9

  - name: 'yieldType'
    type: varchar
    nullable: true
    description: 'Raw yieldType value from Bybit earn yield export'
    source_column_index: 10

metadata:
  refresh_frequency: monthly
  data_classification: internal
  retention_period_days: 1825  # 5 years retention for crypto records
  pii_fields: []
  file_pattern: '*.csv'
