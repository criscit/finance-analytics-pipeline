version: 1.0.0
dataset: telegram_assets
description: Raw assets export from Telegram crypto platform
owner: finance-analytics-team
domain: crypto
source_system: Telegram
format: CSV
delimiter: ";"
encoding: utf-8
skip_header_rows: 0
skip_footer_rows: 0

target_table:
  schema: prod_raw
  name: telegram_assets

columns:
  - name: 'asset_full_name'
    type: varchar
    nullable: true
    description: 'Raw asset_full_name value from Telegram assets export'
    source_column_index: 0

  - name: 'asset_short_name'
    type: varchar
    nullable: true
    description: 'Raw asset_short_name value from Telegram assets export'
    source_column_index: 1

  - name: 'price_usd'
    type: varchar
    nullable: true
    description: 'Raw price_usd value from Telegram assets export'
    source_column_index: 2

  - name: 'change_24h'
    type: varchar
    nullable: true
    description: 'Raw change_24h value from Telegram assets export'
    source_column_index: 3

  - name: 'balance'
    type: varchar
    nullable: true
    description: 'Raw balance value from Telegram assets export'
    source_column_index: 4

  - name: 'value_usd'
    type: varchar
    nullable: true
    description: 'Raw value_usd value from Telegram assets export'
    source_column_index: 5

  - name: 'parsed_at'
    type: varchar
    nullable: true
    description: 'Raw parsed_at value from Telegram assets export'
    source_column_index: 6

metadata:
  refresh_frequency: monthly
  data_classification: internal
  retention_period_days: 1825  # 5 years retention for crypto records
  pii_fields: []
  file_pattern: '*.csv'
