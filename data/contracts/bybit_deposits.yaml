version: 1.0.0
dataset: bybit_deposits
description: Raw deposits export from Bybit crypto platform
owner: finance-analytics-team
domain: crypto
source_system: Bybit
format: CSV
delimiter: ","
encoding: utf-8
skip_header_rows: 0
skip_footer_rows: 0

target_table:
  schema: prod_raw
  name: bybit_deposits
  
columns:
  - name: 'amount'
    type: varchar
    nullable: true
    description: 'Raw amount value from Bybit deposits export'
    source_column_index: 1

  - name: 'batchReleaseLimit'
    type: varchar
    nullable: true
    description: 'Raw batchReleaseLimit value from Bybit deposits export'
    source_column_index: 2

  - name: 'blockHash'
    type: varchar
    nullable: true
    description: 'Raw blockHash value from Bybit deposits export'
    source_column_index: 3

  - name: 'chain'
    type: varchar
    nullable: true
    description: 'Raw chain value from Bybit deposits export'
    source_column_index: 4

  - name: 'coin'
    type: varchar
    nullable: true
    description: 'Raw coin value from Bybit deposits export'
    source_column_index: 5

  - name: 'confirmations'
    type: varchar
    nullable: true
    description: 'Raw confirmations value from Bybit deposits export'
    source_column_index: 6

  - name: 'depositFee'
    type: varchar
    nullable: true
    description: 'Raw depositFee value from Bybit deposits export'
    source_column_index: 7

  - name: 'depositType'
    type: varchar
    nullable: true
    description: 'Raw depositType value from Bybit deposits export'
    source_column_index: 8

  - name: 'fromAddress'
    type: varchar
    nullable: true
    description: 'Raw fromAddress value from Bybit deposits export'
    source_column_index: 9

  - name: 'id'
    type: varchar
    nullable: true
    description: 'Raw id value from Bybit deposits export'
    source_column_index: 10

  - name: 'status'
    type: varchar
    nullable: true
    description: 'Raw status value from Bybit deposits export'
    source_column_index: 11

  - name: 'successAt'
    type: varchar
    nullable: true
    description: 'Raw successAt value from Bybit deposits export'
    source_column_index: 12

  - name: 'tag'
    type: varchar
    nullable: true
    description: 'Raw tag value from Bybit deposits export'
    source_column_index: 13

  - name: 'taxDepositRecordsId'
    type: varchar
    nullable: true
    description: 'Raw taxDepositRecordsId value from Bybit deposits export'
    source_column_index: 14

  - name: 'taxStatus'
    type: varchar
    nullable: true
    description: 'Raw taxStatus value from Bybit deposits export'
    source_column_index: 15

  - name: 'toAddress'
    type: varchar
    nullable: true
    description: 'Raw toAddress value from Bybit deposits export'
    source_column_index: 16

  - name: 'txID'
    type: varchar
    nullable: true
    description: 'Raw txID value from Bybit deposits export'
    source_column_index: 17

  - name: 'txIndex'
    type: varchar
    nullable: true
    description: 'Raw txIndex value from Bybit deposits export'
    source_column_index: 18

metadata:
  refresh_frequency: monthly
  data_classification: internal
  retention_period_days: 1825  # 5 years retention for crypto records
  pii_fields: []
  file_pattern: '*.csv'
