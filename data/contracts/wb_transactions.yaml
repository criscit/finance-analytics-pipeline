version: 1.0.0
dataset: wb_transactions
description: WB Кошелёк operations scraped from the wallet history, each enriched with its operation-card details and fiscal-receipt line items (one row per product)
owner: finance-analytics-team
domain: marketplace
source_system: Wildberries
format: CSV
delimiter: ","
encoding: utf-8
skip_header_rows: 0 # header is the first row
skip_footer_rows: 0

target_table:
  schema: prod_raw
  name: wb_transactions

columns:
  - name: "transaction_dttm"
    type: varchar
    nullable: false
    description: Operation timestamp from the card "Дата и время", as 'YYYY-MM-DD HH:MM:SS'
    source_column_index: 0
    format: "%Y-%m-%d %H:%M:%S"

  - name: "type"
    type: varchar
    nullable: false
    description: Operation type from the card title (e.g. "Оплата по СБП", "Пополнение по СБП", "Оплата")
    source_column_index: 1

  - name: "status"
    type: varchar
    nullable: true
    description: Card status (e.g. "Успех"); empty for direct card "Оплата" cards that carry no status field
    source_column_index: 2

  - name: "commission_rub"
    type: varchar
    nullable: true
    description: Commission amount in RUB, normalised to a plain number ("0" when none)
    source_column_index: 3

  - name: "order_amt_rub"
    type: varchar
    nullable: false
    description: Signed operation amount in RUB (negative for debits/списания, positive for credits)
    source_column_index: 4

  - name: "order_item_num"
    type: varchar
    nullable: true
    description: Sequential item number (№) from the matched receipt; empty for non-purchase operations
    source_column_index: 5

  - name: "item"
    type: varchar
    nullable: true
    description: Product name from the matched fiscal receipt; empty for non-purchase operations
    source_column_index: 6

  - name: "item_price_rub"
    type: varchar
    nullable: true
    description: Receipt item unit price in RUB ("Цена, RUB")
    source_column_index: 7

  - name: "item_qty"
    type: varchar
    nullable: true
    description: Receipt item quantity ("Кол.")
    source_column_index: 8

  - name: "item_amt_rub"
    type: varchar
    nullable: true
    description: Receipt item line total in RUB ("Сумма, RUB")
    source_column_index: 9

  - name: "receipt_url"
    type: varchar
    nullable: true
    description: URL of the matched fiscal receipt on receipt.wb.ru; empty when no receipt matched
    source_column_index: 10

  - name: "op_id"
    type: varchar
    nullable: true
    description: Wallet operation id ("Идентификатор операции"); empty for direct card "Оплата" cards
    source_column_index: 11

  - name: "raw_details"
    type: varchar
    nullable: true
    description: Raw newline-joined label/value lines from the operation card (debugging/audit)
    source_column_index: 12

metadata:
  refresh_frequency: monthly
  data_classification: internal
  retention_period_days: 2555  # ~7 years for financial data
  pii_fields: ['receipt_url']
  file_pattern: "wb_*.csv"
