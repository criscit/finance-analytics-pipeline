version: 1.0.0
dataset: telegram_earn
description: Raw earn export from Telegram crypto platform
owner: finance-analytics-team
domain: crypto
source_system: Telegram
format: CSV
delimiter: ";"
encoding: utf-8
skip_header_rows: 0
skip_footer_rows: 0

target_table:
  schema: prod_raw
  name: telegram_earn
  
columns:
  - name: 'asset'
    type: varchar
    nullable: true
    description: 'Raw asset value from Telegram earn export'
    source_column_index: 1

  - name: 'apy'
    type: varchar
    nullable: true
    description: 'Raw apy value from Telegram earn export'
    source_column_index: 2

  - name: 'value_usd'
    type: varchar
    nullable: true
    description: 'Raw value_usd value from Telegram earn export'
    source_column_index: 3

  - name: 'yield'
    type: varchar
    nullable: true
    description: 'Raw yield value from Telegram earn export'
    source_column_index: 4

  - name: 'processed_dttm'
    type: varchar
    nullable: true
    description: 'Raw processed_dttm value from Telegram earn export'
    source_column_index: 5

metadata:
  refresh_frequency: monthly
  data_classification: internal
  retention_period_days: 1825  # 5 years retention for crypto records
  pii_fields: []
  file_pattern: '*.csv'
