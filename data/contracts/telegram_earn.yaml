version: 1.0.0
dataset: telegram_earn
description: Raw earn export from Telegram crypto platform
owner: finance-analytics-team
domain: crypto
source_system: Telegram
format: CSV
delimiter: ";"
encoding: utf-8
skip_header_rows: 0
skip_footer_rows: 0

target_table:
  schema: prod_raw
  name: telegram_earn
  
columns:
  - name: 'asset'
    type: varchar
    nullable: true
    description: 'Raw asset value from Telegram earn export'
    source_column_index: 0

  - name: 'apy'
    type: varchar
    nullable: true
    description: 'Raw apy value from Telegram earn export'
    source_column_index: 1

  - name: 'wallet_balance'
    type: varchar
    nullable: true
    description: 'Raw wallet_balance value from Telegram earn export'
    source_column_index: 2

  - name: 'price_usd'
    type: varchar
    nullable: true
    description: 'Raw price_usd value from Telegram earn export'
    source_column_index: 3

  - name: 'value_usd'
    type: varchar
    nullable: true
    description: 'Raw value_usd value from Telegram earn export'
    source_column_index: 4

  - name: 'yield_usd'
    type: varchar
    nullable: true
    description: 'Raw yield_usd value from Telegram earn export'
    source_column_index: 5

  - name: 'parsed_at'
    type: varchar
    nullable: true
    description: 'Raw parsed_at value from Telegram earn export'
    source_column_index: 6

metadata:
  refresh_frequency: monthly
  data_classification: internal
  retention_period_days: 1825  # 5 years retention for crypto records
  pii_fields: []
  file_pattern: '*.csv'
