version: 1.0.0
dataset: binance_p2p_trades
description: Raw p2p trades export from Binance crypto platform
owner: finance-analytics-team
domain: crypto
source_system: Binance
format: CSV
delimiter: ","
encoding: utf-8
skip_header_rows: 0
skip_footer_rows: 0

target_table:
  schema: prod_raw
  name: binance_p2p_trades
  
