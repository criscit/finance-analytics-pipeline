version: 1.0.0
dataset: binance_fiat_payments
description: Raw fiat payments export from Binance crypto platform
owner: finance-analytics-team
domain: crypto
source_system: Binance
format: CSV
delimiter: ","
encoding: utf-8
skip_header_rows: 0
skip_footer_rows: 0

target_table:
  schema: prod_raw
  name: binance_fiat_payments
  
columns:
  - name: 'createTime'
    type: varchar
    nullable: true
    description: 'Raw createTime value from Binance fiat payments export'
    source_column_index: 1

  - name: 'cryptoCurrency'
    type: varchar
    nullable: true
    description: 'Raw cryptoCurrency value from Binance fiat payments export'
    source_column_index: 2

  - name: 'fiatCurrency'
    type: varchar
    nullable: true
    description: 'Raw fiatCurrency value from Binance fiat payments export'
    source_column_index: 3

  - name: 'obtainAmount'
    type: varchar
    nullable: true
    description: 'Raw obtainAmount value from Binance fiat payments export'
    source_column_index: 4

  - name: 'orderNo'
    type: varchar
    nullable: true
    description: 'Raw orderNo value from Binance fiat payments export'
    source_column_index: 5

  - name: 'paymentMethod'
    type: varchar
    nullable: true
    description: 'Raw paymentMethod value from Binance fiat payments export'
    source_column_index: 6

  - name: 'price'
    type: varchar
    nullable: true
    description: 'Raw price value from Binance fiat payments export'
    source_column_index: 7

  - name: 'sourceAmount'
    type: varchar
    nullable: true
    description: 'Raw sourceAmount value from Binance fiat payments export'
    source_column_index: 8

  - name: 'status'
    type: varchar
    nullable: true
    description: 'Raw status value from Binance fiat payments export'
    source_column_index: 9

  - name: 'totalFee'
    type: varchar
    nullable: true
    description: 'Raw totalFee value from Binance fiat payments export'
    source_column_index: 10

  - name: 'transactionType'
    type: varchar
    nullable: true
    description: 'Raw transactionType value from Binance fiat payments export'
    source_column_index: 11

  - name: 'updateTime'
    type: varchar
    nullable: true
    description: 'Raw updateTime value from Binance fiat payments export'
    source_column_index: 12

metadata:
  refresh_frequency: monthly
  data_classification: internal
  retention_period_days: 1825  # 5 years retention for crypto records
  pii_fields: []
  file_pattern: '*.csv'
