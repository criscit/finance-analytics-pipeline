version: 1.0.0
dataset: bybit_assets
description: Raw assets export from Bybit crypto platform
owner: finance-analytics-team
domain: crypto
source_system: Bybit
format: CSV
delimiter: ","
encoding: utf-8
skip_header_rows: 0
skip_footer_rows: 0

target_table:
  schema: prod_raw
  name: bybit_assets

columns:
  - name: 'coin'
    type: varchar
    nullable: true
    description: 'Raw coin value from Bybit assets export'
    source_column_index: 0

  - name: 'equity'
    type: varchar
    nullable: true
    description: 'Raw equity value from Bybit assets export'
    source_column_index: 1

  - name: 'free'
    type: varchar
    nullable: true
    description: 'Raw free value from Bybit assets export'
    source_column_index: 2

  - name: 'locked'
    type: varchar
    nullable: true
    description: 'Raw locked value from Bybit assets export'
    source_column_index: 3

  - name: 'price_usd'
    type: varchar
    nullable: true
    description: 'Raw price_usd value from Bybit assets export'
    source_column_index: 4

  - name: 'usdValue'
    type: varchar
    nullable: true
    description: 'Raw usdValue value from Bybit assets export'
    source_column_index: 5

  - name: 'walletBalance'
    type: varchar
    nullable: true
    description: 'Raw walletBalance value from Bybit assets export'
    source_column_index: 6

metadata:
  refresh_frequency: monthly
  data_classification: internal
  retention_period_days: 1825  # 5 years retention for crypto records
  pii_fields: []
  file_pattern: '*.csv'
