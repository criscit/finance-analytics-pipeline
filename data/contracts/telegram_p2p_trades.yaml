version: 1.0.0
dataset: telegram_p2p_trades
description: Raw p2p trades export from Telegram crypto platform
owner: finance-analytics-team
domain: crypto
source_system: Telegram
format: CSV
delimiter: ","
encoding: utf-8
skip_header_rows: 0
skip_footer_rows: 0

target_table:
  schema: prod_raw
  name: telegram_p2p_trades

columns:
  - name: 'Ad Number'
    type: varchar
    nullable: true
    description: 'Raw Ad Number value from Telegram p2p trades export'
    source_column_index: 0

  - name: 'Ad Type'
    type: varchar
    nullable: true
    description: 'Raw Ad Type value from Telegram p2p trades export'
    source_column_index: 1

  - name: 'Order Number'
    type: varchar
    nullable: true
    description: 'Raw Order Number value from Telegram p2p trades export'
    source_column_index: 2

  - name: 'Role'
    type: varchar
    nullable: true
    description: 'Raw Role value from Telegram p2p trades export'
    source_column_index: 3

  - name: 'Net Crypto Amount'
    type: varchar
    nullable: true
    description: 'Raw Net Crypto Amount value from Telegram p2p trades export'
    source_column_index: 4

  - name: 'Paid Fee Crypto Amount'
    type: varchar
    nullable: true
    description: 'Raw Paid Fee Crypto Amount value from Telegram p2p trades export'
    source_column_index: 5

  - name: 'Crypto Currency'
    type: varchar
    nullable: true
    description: 'Raw Crypto Currency value from Telegram p2p trades export'
    source_column_index: 6

  - name: 'Fiat Amount'
    type: varchar
    nullable: true
    description: 'Raw Fiat Amount value from Telegram p2p trades export'
    source_column_index: 7

  - name: 'Fiat Currency'
    type: varchar
    nullable: true
    description: 'Raw Fiat Currency value from Telegram p2p trades export'
    source_column_index: 8

  - name: 'Price'
    type: varchar
    nullable: true
    description: 'Raw Price value from Telegram p2p trades export'
    source_column_index: 9

  - name: 'Payment Method'
    type: varchar
    nullable: true
    description: 'Raw Payment Method value from Telegram p2p trades export'
    source_column_index: 10

  - name: 'Creation Time'
    type: varchar
    nullable: true
    description: 'Raw Creation Time value from Telegram p2p trades export'
    source_column_index: 11

  - name: 'Completion Time'
    type: varchar
    nullable: true
    description: 'Raw Completion Time value from Telegram p2p trades export'
    source_column_index: 12

metadata:
  refresh_frequency: monthly
  data_classification: internal
  retention_period_days: 1825  # 5 years retention for crypto records
  pii_fields: []
  file_pattern: '*.csv'
