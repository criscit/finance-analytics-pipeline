version: 1.0.0
dataset: telegram_general_transactions
description: Raw general transactions export from Telegram crypto platform
owner: finance-analytics-team
domain: crypto
source_system: Telegram
format: CSV
delimiter: ";"
encoding: utf-8
skip_header_rows: 0
skip_footer_rows: 0

target_table:
  schema: prod_raw
  name: telegram_general_transactions
  
columns:
  - name: 'type'
    type: varchar
    nullable: true
    description: 'Raw type value from Telegram general transactions export'
    source_column_index: 1

  - name: 'date'
    type: varchar
    nullable: true
    description: 'Raw date value from Telegram general transactions export'
    source_column_index: 2

  - name: 'time'
    type: varchar
    nullable: true
    description: 'Raw time value from Telegram general transactions export'
    source_column_index: 3

  - name: 'status'
    type: varchar
    nullable: true
    description: 'Raw status value from Telegram general transactions export'
    source_column_index: 4

  - name: 'amount_in'
    type: varchar
    nullable: true
    description: 'Raw amount_in value from Telegram general transactions export'
    source_column_index: 5

  - name: 'currency_in'
    type: varchar
    nullable: true
    description: 'Raw currency_in value from Telegram general transactions export'
    source_column_index: 6

  - name: 'amount_out'
    type: varchar
    nullable: true
    description: 'Raw amount_out value from Telegram general transactions export'
    source_column_index: 7

  - name: 'currency_out'
    type: varchar
    nullable: true
    description: 'Raw currency_out value from Telegram general transactions export'
    source_column_index: 8

  - name: 'ex_rate_base'
    type: varchar
    nullable: true
    description: 'Raw ex_rate_base value from Telegram general transactions export'
    source_column_index: 9

  - name: 'ex_rate_quote'
    type: varchar
    nullable: true
    description: 'Raw ex_rate_quote value from Telegram general transactions export'
    source_column_index: 10

  - name: 'ex_rate_value'
    type: varchar
    nullable: true
    description: 'Raw ex_rate_value value from Telegram general transactions export'
    source_column_index: 11

  - name: 'counterparty'
    type: varchar
    nullable: true
    description: 'Raw counterparty value from Telegram general transactions export'
    source_column_index: 12

  - name: 'order_id'
    type: varchar
    nullable: true
    description: 'Raw order_id value from Telegram general transactions export'
    source_column_index: 13

  - name: 'source'
    type: varchar
    nullable: true
    description: 'Raw source value from Telegram general transactions export'
    source_column_index: 14

  - name: 'fee_amount'
    type: varchar
    nullable: true
    description: 'Raw fee_amount value from Telegram general transactions export'
    source_column_index: 15

  - name: 'fee_currency'
    type: varchar
    nullable: true
    description: 'Raw fee_currency value from Telegram general transactions export'
    source_column_index: 16

  - name: 'raw'
    type: varchar
    nullable: true
    description: 'Raw raw value from Telegram general transactions export'
    source_column_index: 17

  - name: 'processed_dttm'
    type: varchar
    nullable: true
    description: 'Raw processed_dttm value from Telegram general transactions export'
    source_column_index: 18

metadata:
  refresh_frequency: monthly
  data_classification: internal
  retention_period_days: 1825  # 5 years retention for crypto records
  pii_fields: []
  file_pattern: '*.csv'
