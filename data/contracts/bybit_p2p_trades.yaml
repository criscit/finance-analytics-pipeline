version: 1.0.0
dataset: bybit_p2p_trades
description: Raw p2p trades export from Bybit crypto platform
owner: finance-analytics-team
domain: crypto
source_system: Bybit
format: CSV
delimiter: ";"
encoding: utf-8
skip_header_rows: 0
skip_footer_rows: 0

target_table:
  schema: prod_raw
  name: bybit_p2p_trades
  
columns:
  - name: 'Qty'
    type: varchar
    nullable: true
    description: 'Raw Qty value from Bybit p2p trades export'
    source_column_index: 1

  - name: 'Amount'
    type: varchar
    nullable: true
    description: 'Raw Amount value from Bybit p2p trades export'
    source_column_index: 2

  - name: 'Price'
    type: varchar
    nullable: true
    description: 'Raw Price value from Bybit p2p trades export'
    source_column_index: 3

  - name: 'Type'
    type: varchar
    nullable: true
    description: 'Raw Type value from Bybit p2p trades export'
    source_column_index: 4

  - name: 'Status'
    type: varchar
    nullable: true
    description: 'Raw Status value from Bybit p2p trades export'
    source_column_index: 5

  - name: 'Fee'
    type: varchar
    nullable: true
    description: 'Raw Fee value from Bybit p2p trades export'
    source_column_index: 6

  - name: 'Date & Time'
    type: varchar
    nullable: true
    description: 'Raw Date & Time value from Bybit p2p trades export'
    source_column_index: 7

  - name: 'Order No.'
    type: varchar
    nullable: true
    description: 'Raw Order No. value from Bybit p2p trades export'
    source_column_index: 8

metadata:
  refresh_frequency: monthly
  data_classification: internal
  retention_period_days: 1825  # 5 years retention for crypto records
  pii_fields: []
  file_pattern: '*.csv'
