# file: quality/gx/expectations/raw/t_bank_transactions/data_presence_check.yml
data_asset_type: null
expectation_suite_name: raw.t_bank_transactions.data_presence_check
expectations:
  # Check that the table exists and has data
  - expectation_type: expect_table_row_count_to_be_between
    kwargs:
      min_value: 1
      max_value: null

  # Check that required columns exist
  - expectation_type: expect_column_to_exist
    kwargs:
      column: __load_key
  - expectation_type: expect_column_to_exist
    kwargs:
      column: processed_at

  # Check that load key is not null (critical for deduplication)
  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: __load_key

  # Check that ingested_at is not null (critical for data lineage)
  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: processed_at

  # Check that load key is unique (no duplicates in raw table)
  - expectation_type: expect_column_values_to_be_unique
    kwargs:
      column: __load_key

  # Check that we have recent data (within last 1 day)
  - expectation_type: expect_column_values_to_be_between
    kwargs:
      column: processed_at
      min_value: "{{ datetime.datetime.now() - datetime.timedelta(days=1) }}"
      max_value: "{{ datetime.datetime.now() }}"

  # Check that the table has a reasonable number of rows (not empty, not suspiciously large)
  - expectation_type: expect_table_row_count_to_be_between
    kwargs:
      min_value: 1
      max_value: 1000000  # Adjust based on your expected data volume

ge_cloud_id: null
meta:
  great_expectations_version: 0.18.12
  description: "Ensures raw table has data before dbt processing begins"
  created_by: "data_engineer"
  created_at: "2025-01-27"
