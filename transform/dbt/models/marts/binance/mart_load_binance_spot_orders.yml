version: 2
models:
- name: mart_load_binance_spot_orders
  description: 'Mart table for Binance spot order executions (filled and partially
    filled only). Contains order execution details with UTC timestamps.

    '
  tags:
  - mart
  - binance
  - fact
  - spot_orders
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: spot_order_bk
  columns:
  - name: spot_order_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: pair
    description: 'Trading pair symbol'
    data_type: varchar(64)
  - name: order_price
    description: 'Original order price requested'
    data_type: double
  - name: order_amt
    description: 'Original order amount requested'
    data_type: double
  - name: executed_amt
    description: 'Amount actually executed'
    data_type: double
  - name: average_price
    description: 'Average execution price'
    data_type: double
  - name: trading_total
    description: 'Total trading value'
    data_type: varchar(64)
  - name: order_amt_currency
    description: 'Currency for order amount'
    data_type: double
  - name: executed_amt_currency
    description: 'Currency for executed amount'
    data_type: double
  - name: trading_total_currency
    description: 'Currency for trading total'
    data_type: varchar(64)
  - name: order_type
    description: 'Order type (market, limit, etc.)'
    data_type: varchar(64)
  - name: order_side
    description: 'Order side (buy or sell)'
    data_type: varchar(64)
  - name: executed_price_usd
    description: 'Executed price in USD'
    data_type: double
  - name: trading_currency
    description: 'Trading currency code'
    data_type: varchar(16)
  - name: trading_price_usd
    description: 'Trading price in USD'
    data_type: double
  - name: order_placed_at_utc
    description: 'Order placement timestamp (UTC)'
    data_type: timestamp
  - name: executed_at_utc
    description: 'Order execution timestamp (UTC)'
    data_type: timestamp
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
