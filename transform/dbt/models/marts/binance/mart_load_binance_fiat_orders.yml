version: 2
models:
- name: mart_load_binance_fiat_orders
  description: 'Mart table for Binance fiat deposit/withdrawal orders with parsed
    amounts. Tracks fiat currency transactions in and out of Binance.

    '
  tags:
  - mart
  - binance
  - fact
  - fiat_orders
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: fiat_order_bk
  columns:
  - name: fiat_order_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: executed_at
    description: 'Fiat order execution timestamp (Europe/Moscow timezone)'
    data_type: timestamp
  - name: executed_dt
    description: 'Fiat order execution date (Europe/Moscow timezone)'
    data_type: date
  - name: amount
    description: 'Order amount in fiat currency'
    data_type: varchar(64)
  - name: indicated_amt
    description: 'Indicated or requested amount'
    data_type: double
  - name: total_fee
    description: 'Total fees charged for the order'
    data_type: double
  - name: fiat_currency
    description: 'Fiat currency code'
    data_type: varchar(64)
  - name: method
    description: 'Payment method used'
    data_type: varchar(64)
  - name: transaction_type
    description: 'Transaction type (deposit or withdrawal)'
    data_type: varchar(64)
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
