version: 2
models:
- name: mart_load_binance_fiat_payments
  description: 'Mart table for Binance fiat payment transactions with parsed amounts.
    Tracks crypto purchases with fiat currency payments.

    '
  tags:
  - mart
  - binance
  - fact
  - fiat_payments
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: fiat_payment_bk
  columns:
  - name: fiat_payment_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: executed_at_utc
    description: 'Fiat payment execution timestamp (UTC)'
    data_type: timestamp
  - name: obtain_amt
    description: 'Amount of cryptocurrency obtained'
    data_type: double
  - name: source_amt
    description: 'Source fiat amount paid'
    data_type: double
  - name: price
    description: 'Price per unit of cryptocurrency'
    data_type: double
  - name: total_fee
    description: 'Total fees charged for the payment'
    data_type: double
  - name: crypto_currency
    description: 'Cryptocurrency symbol obtained'
    data_type: varchar(64)
  - name: fiat_currency
    description: 'Fiat currency code used for payment'
    data_type: varchar(64)
  - name: payment_method
    description: 'Payment method used'
    data_type: varchar(64)
  - name: transaction_type
    description: 'Transaction type (buy or sell)'
    data_type: varchar(64)
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
