version: 2
models:
- name: mart_load_binance_assets
  description: 'Mart table for Binance asset balances (non-zero balances only). Contains
    current holdings in spot wallet with USDT equivalent valuations.

    '
  tags:
  - mart
  - binance
  - snapshot
  - assets
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: asset_bk
  columns:
  - name: asset_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: asset
    description: 'Cryptocurrency symbol'
    data_type: varchar(64)
  - name: free
    description: 'Available balance for trading or withdrawal'
    data_type: varchar(64)
  - name: locked
    description: 'Balance locked in orders or positions'
    data_type: varchar(64)
  - name: total
    description: 'Total balance (free + locked)'
    data_type: varchar(64)
  - name: amount_usd
    description: 'Total asset amount in USD'
    data_type: varchar(64)
  - name: price_usd
    description: 'Current USD price per unit'
    data_type: double
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
