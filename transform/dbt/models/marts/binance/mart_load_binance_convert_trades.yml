version: 2
models:
- name: mart_load_binance_convert_trades
  description: 'Mart table for Binance convert trades with parsed timestamps and numeric
    values. Tracks instant cryptocurrency conversion transactions.

    '
  tags:
  - mart
  - binance
  - fact
  - convert
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: convert_trade_bk
  columns:
  - name: convert_trade_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: created_at
    description: 'Convert trade creation timestamp (Europe/Moscow timezone)'
    data_type: timestamp
  - name: created_dt
    description: 'Convert trade creation date (Europe/Moscow timezone)'
    data_type: date
  - name: from_amt
    description: 'Amount converted from source cryptocurrency'
    data_type: double
  - name: from_asset
    description: 'Source cryptocurrency symbol'
    data_type: varchar(64)
  - name: to_amt
    description: 'Amount received in target cryptocurrency'
    data_type: double
  - name: to_asset
    description: 'Target cryptocurrency symbol'
    data_type: varchar(64)
  - name: ratio
    description: 'Conversion ratio from source to target'
    data_type: varchar(64)
  - name: inverse_ratio
    description: 'Inverse conversion ratio from target to source'
    data_type: varchar(64)
  - name: order_type
    description: 'Order type for conversion'
    data_type: varchar(64)
  - name: side
    description: 'Conversion side (buy or sell)'
    data_type: varchar(64)
  - name: wallet_type
    description: 'Wallet type used for conversion'
    data_type: varchar(64)
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
