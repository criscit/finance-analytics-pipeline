version: 2
models:
- name: mart_load_bybit_spot_orders
  description: 'Mart table for Bybit spot order executions with parsed numeric fields
    and Moscow timezone. Contains key execution metrics for analytics.

    '
  tags:
  - mart
  - bybit
  - fact
  - spot_orders
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: spot_order_bk
  columns:
  - name: spot_order_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: exec_fee
    description: 'Trading fee charged for order execution'
    data_type: double
  - name: exec_price
    description: 'Actual execution price per unit'
    data_type: double
  - name: exec_qty
    description: 'Quantity executed in this order'
    data_type: double
  - name: exec_value
    description: 'Total value of executed quantity'
    data_type: double
  - name: extra_fees
    description: 'Additional fees beyond standard trading fee'
    data_type: double
  - name: fee_rate
    description: 'Fee rate percentage applied to order'
    data_type: double
  - name: leaves_qty
    description: 'Remaining unfilled quantity'
    data_type: double
  - name: order_price
    description: 'Original order price requested'
    data_type: double
  - name: order_qty
    description: 'Original order quantity requested'
    data_type: double
  - name: executed_at
    description: 'Order execution timestamp (Europe/Moscow timezone)'
    data_type: timestamp
  - name: executed_dt
    description: 'Order execution date (Europe/Moscow timezone)'
    data_type: date
  - name: exec_type
    description: 'Order execution type'
    data_type: varchar(64)
  - name: fee_currency
    description: 'Currency in which fee is charged'
    data_type: double
  - name: is_maker
    description: 'Indicates if order was maker or taker'
    data_type: varchar(64)
  - name: order_type
    description: 'Order type (market, limit, etc.)'
    data_type: varchar(64)
  - name: side
    description: 'Order side (buy or sell)'
    data_type: varchar(64)
  - name: symbol
    description: 'Trading pair symbol'
    data_type: varchar(64)
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
