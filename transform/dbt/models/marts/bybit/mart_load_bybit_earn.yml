version: 2
models:
- name: mart_load_bybit_earn
  description: 'Mart table for Bybit wallet earn positions with parsed APY and yield
    values. Tracks staking and yield-earning positions in Bybit wallet.

    '
  tags:
  - mart
  - bybit
  - snapshot
  - earn
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: earn_bk
  columns:
  - name: earn_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: asset
    description: 'Cryptocurrency symbol in earn position'
    data_type: varchar(64)
  - name: apy
    description: 'Annual Percentage Yield (APY) for the earn position'
    data_type: double
  - name: wallet_balance
    description: 'Wallet balance of the asset in native coin units'
    data_type: double
  - name: asset_usdt_price
    description: 'Asset price in USDT'
    data_type: double
  - name: wallet_balance_usd
    description: 'Wallet balance in USD'
    data_type: double
  - name: value_usd
    description: 'Total USD value of the staked/earning position'
    data_type: double
  - name: yield_usd
    description: 'Total USD yield earned'
    data_type: double
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
