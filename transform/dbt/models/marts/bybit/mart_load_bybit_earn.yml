version: 2
models:
- name: mart_load_bybit_earn
  description: 'Mart view for Bybit wallet earn positions with APY, balance, and
    aggregated yield values. Tracks staking and yield-earning positions in Bybit wallet.

    '
  tags:
  - mart
  - bybit
  - snapshot
  - earn
  meta:
    materialization: view
  columns:
  - name: earn_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: asset
    description: 'Cryptocurrency symbol in earn position'
    data_type: varchar(64)
  - name: apy
    description: 'Annual Percentage Yield (APY) for the earn position'
    data_type: double
  - name: wallet_balance
    description: 'Wallet balance of the asset in native coin units'
    data_type: double
  - name: price_usd
    description: 'Asset price in USD'
    data_type: double
  - name: amount_usd
    description: 'Principal USD value (wallet_balance * price_usd for non-stablecoins)'
    data_type: double
  - name: total_yield_usd
    description: 'Total USD yield earned from all yield distributions for this asset'
    data_type: double
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
