version: 2
models:
- name: mart_load_bybit_assets
  description: 'Mart table for Bybit asset balances. Contains current holdings across
    different wallets with USD valuations.

    '
  tags:
  - mart
  - bybit
  - snapshot
  - assets
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: asset_bk
  columns:
  - name: asset_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: coin
    description: 'Cryptocurrency symbol'
    data_type: varchar(64)
  - name: equity
    description: 'Total equity balance for the asset'
    data_type: varchar(64)
  - name: free
    description: 'Available balance for trading or withdrawal'
    data_type: varchar(64)
  - name: locked
    description: 'Balance locked in orders or positions'
    data_type: varchar(64)
  - name: usd_value
    description: 'Total asset value in USD'
    data_type: double
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
