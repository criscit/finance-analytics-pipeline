version: 2
models:
- name: mart_load_bybit_p2p_trades
  description: 'Mart table for Bybit P2P trades (completed trades only). Tracks peer-to-peer
    cryptocurrency trades with fiat currencies and Moscow timezone timestamps.

    '
  tags:
  - mart
  - bybit
  - fact
  - p2p
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: p2p_trade_bk
  columns:
  - name: p2p_trade_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: qty
    description: 'Cryptocurrency quantity traded'
    data_type: double
  - name: amount
    description: 'Fiat currency amount for the trade'
    data_type: varchar(64)
  - name: price
    description: 'Unit price of cryptocurrency in fiat currency'
    data_type: double
  - name: fee
    description: 'Transaction fee for P2P trade'
    data_type: double
  - name: type
    description: 'Trade type (buy or sell)'
    data_type: varchar(64)
  - name: executed_at
    description: 'Trade execution timestamp in Europe/Moscow timezone'
    data_type: timestamp
  - name: executed_dt
    description: 'Trade execution date (Europe/Moscow timezone)'
    data_type: date
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
