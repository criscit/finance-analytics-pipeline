version: 2
models:
- name: mart_load_bybit_internal_transfers
  description: 'Mart table for Bybit internal account transfers with parsed amounts.
    Tracks movements between different account types within Bybit (e.g., spot to derivatives).

    '
  tags:
  - mart
  - bybit
  - fact
  - transfers
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: transfer_bk
  columns:
  - name: transfer_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: amount
    description: 'Transfer amount in cryptocurrency units'
    data_type: varchar(64)
  - name: coin
    description: 'Cryptocurrency symbol transferred'
    data_type: varchar(64)
  - name: from_account_type
    description: 'Source account type (spot, derivatives, etc.)'
    data_type: varchar(64)
  - name: to_account_type
    description: 'Target account type (spot, derivatives, etc.)'
    data_type: varchar(64)
  - name: price_usd
    description: 'USD price of the coin at transfer time'
    data_type: double
  - name: success_at
    description: 'Transfer success timestamp (Europe/Moscow timezone)'
    data_type: timestamp
  - name: success_dt
    description: 'Transfer success date (Europe/Moscow timezone)'
    data_type: date
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
