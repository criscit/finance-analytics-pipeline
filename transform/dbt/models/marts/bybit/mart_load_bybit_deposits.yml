version: 2
models:
- name: mart_load_bybit_deposits
  description: 'Mart table for Bybit deposit transactions with parsed amounts and
    timestamps. Tracks incoming cryptocurrency deposits to Bybit wallets.

    '
  tags:
  - mart
  - bybit
  - fact
  - deposits
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: deposit_bk
  columns:
  - name: deposit_bk
    description: 'TODO: Add description for deposit_bk'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: amount
    description: 'TODO: Add description for amount'
    data_type: varchar(64)
  - name: deposit_fee
    description: 'TODO: Add description for deposit_fee'
    data_type: double
  - name: chain
    description: 'TODO: Add description for chain'
    data_type: varchar(64)
  - name: coin
    description: 'TODO: Add description for coin'
    data_type: varchar(64)
  - name: success_at
    description: 'TODO: Add description for success_at'
    data_type: timestamp
  - name: processed_at
    description: 'TODO: Add description for processed_at'
    data_type: timestamp
    data_tests:
    - not_null
