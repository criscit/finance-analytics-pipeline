version: 2
models:
- name: mart_load_bybit_deposits
  description: 'Mart table for Bybit deposit transactions with parsed amounts and
    timestamps. Tracks incoming cryptocurrency deposits to Bybit wallets.

    '
  tags:
  - mart
  - bybit
  - fact
  - deposits
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: deposit_bk
  columns:
  - name: deposit_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: amount
    description: 'Deposit amount in cryptocurrency units'
    data_type: varchar(64)
  - name: deposit_fee
    description: 'Network fee charged for the deposit'
    data_type: double
  - name: chain
    description: 'Blockchain network used for deposit'
    data_type: varchar(64)
  - name: coin
    description: 'Cryptocurrency symbol deposited'
    data_type: varchar(64)
  - name: success_at_utc
    description: 'Deposit success timestamp (UTC)'
    data_type: timestamp
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
