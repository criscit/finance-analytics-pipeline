version: 2
models:
- name: mart_load_bybit_withdrawals
  description: 'Mart table for Bybit withdrawal transactions with parsed amounts and
    timestamps. Tracks outgoing cryptocurrency withdrawals from Bybit wallets.

    '
  tags:
  - mart
  - bybit
  - fact
  - withdrawals
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: withdrawal_bk
  columns:
  - name: withdrawal_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: amount
    description: 'Withdrawal amount in cryptocurrency units'
    data_type: varchar(64)
  - name: withdraw_fee
    description: 'Network fee charged for the withdrawal'
    data_type: double
  - name: chain
    description: 'Blockchain network used for withdrawal'
    data_type: varchar(64)
  - name: coin
    description: 'Cryptocurrency symbol withdrawn'
    data_type: varchar(64)
  - name: price_usd
    description: 'USD price of the coin at withdrawal time'
    data_type: double
  - name: executed_at
    description: 'Withdrawal execution timestamp (Europe/Moscow timezone)'
    data_type: timestamp
  - name: executed_dt
    description: 'Withdrawal execution date (Europe/Moscow timezone)'
    data_type: date
  - name: withdraw_type
    description: 'Type of withdrawal (on-chain, internal, etc.)'
    data_type: varchar(64)
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
