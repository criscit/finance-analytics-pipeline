version: 2
models:
- name: mart_load_bakai_transactions
  description: 'Mart table for bank transactions analytics with successful transactions
    only. This table contains filtered transaction data for analytics purposes with
    Moscow timezone.

    '
  tags: []
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: transaction_bk
  columns:
  - name: transaction_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: description
    description: 'Transaction description or memo'
    data_type: varchar(64)
  - name: transaction_amt
    description: 'Transaction amount in transaction currency'
    data_type: double
  - name: exchange_rate
    description: 'Currency exchange rate applied to transaction'
    data_type: double
  - name: transacted_at_utc
    description: 'Transaction timestamp in UTC'
    data_type: varchar(64)
  - name: transaction_dt
    description: 'Transaction date'
    data_type: varchar(64)
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
