version: 2
models:
- name: mart_load_telegram_earn
  description: 'Mart view for Telegram wallet earn positions with APY, balance, and
    yield values. Tracks staking and yield-earning positions in Telegram wallet.

    '
  tags:
  - mart
  - telegram
  - snapshot
  - earn
  meta:
    materialization: view
  columns:
  - name: earn_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: asset
    description: 'Cryptocurrency symbol in earn position'
    data_type: varchar(64)
  - name: apy_pct
    description: 'Annual Percentage Yield (APY) for the earn position'
    data_type: double
  - name: wallet_balance
    description: 'Balance of the asset in native coin units'
    data_type: double
  - name: price_usd
    description: 'Price per coin in USD'
    data_type: double
  - name: amount_usd
    description: 'Principal USD value (wallet_balance * price_usd for non-stablecoins)'
    data_type: double
  - name: total_yield_usd
    description: 'Total USD yield earned'
    data_type: double
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
