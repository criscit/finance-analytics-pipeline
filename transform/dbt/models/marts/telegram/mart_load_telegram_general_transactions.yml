version: 2
models:
- name: mart_load_telegram_general_transactions
  description: 'Mart table for Telegram wallet general transactions with parsed amounts
    and exchange rates. Tracks various transaction types including swaps, deposits,
    withdrawals, and transfers.

    '
  tags:
  - mart
  - telegram
  - fact
  - general_transactions
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: transaction_bk
  columns:
  - name: transaction_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: transaction_type
    description: 'Type of transaction (swap, deposit, withdrawal, transfer, etc.)'
    data_type: varchar(64)
  - name: status
    description: 'Transaction status (completed, pending, failed, etc.)'
    data_type: varchar(64)
  - name: amount_in
    description: 'Incoming amount in the transaction'
    data_type: varchar(64)
  - name: currency_in
    description: 'Currency symbol for incoming amount'
    data_type: varchar(64)
  - name: amount_out
    description: 'Outgoing amount in the transaction'
    data_type: varchar(64)
  - name: currency_out
    description: 'Currency symbol for outgoing amount'
    data_type: varchar(64)
  - name: ex_rate_value
    description: 'Exchange rate value applied to transaction'
    data_type: double
  - name: ex_rate_base
    description: 'Base currency for exchange rate'
    data_type: double
  - name: ex_rate_quote
    description: 'Quote currency for exchange rate'
    data_type: double
  - name: fee_amt
    description: 'Transaction fee amount'
    data_type: double
  - name: fee_currency
    description: 'Currency in which fee is charged'
    data_type: double
  - name: counterparty
    description: 'Counterparty involved in the transaction'
    data_type: varchar(64)
  - name: transacted_at_utc
    description: 'Transaction timestamp (UTC timezone)'
    data_type: timestamp
  - name: transacted_dt
    description: 'Transaction date (Europe/Moscow timezone)'
    data_type: date
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
