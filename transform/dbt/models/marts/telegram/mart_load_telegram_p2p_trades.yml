version: 2
models:
- name: mart_load_telegram_p2p_trades
  description: 'Mart table for Telegram wallet P2P trades with parsed crypto and fiat
    amounts. Tracks peer-to-peer cryptocurrency trades facilitated through Telegram
    wallet.

    '
  tags:
  - mart
  - telegram
  - fact
  - p2p
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: p2p_trade_bk
  columns:
  - name: p2p_trade_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: ad_type
    description: 'Advertisement type (buy or sell)'
    data_type: varchar(64)
  - name: role
    description: 'User role in the trade (maker or taker)'
    data_type: varchar(64)
  - name: net_crypto_amt
    description: 'Net cryptocurrency amount after fees'
    data_type: double
  - name: paid_fee_crypto_amt
    description: 'Transaction fee paid in cryptocurrency'
    data_type: double
  - name: fiat_amt
    description: 'Fiat currency amount for the trade'
    data_type: double
  - name: price
    description: 'Unit price of cryptocurrency in fiat currency'
    data_type: double
  - name: crypto_currency
    description: 'Cryptocurrency symbol traded'
    data_type: varchar(64)
  - name: fiat_currency
    description: 'Fiat currency code used for the trade'
    data_type: varchar(64)
  - name: payment_method
    description: 'Payment method used for the trade'
    data_type: varchar(64)
  - name: created_at
    description: 'P2P trade creation timestamp (Europe/Moscow timezone)'
    data_type: timestamp
  - name: created_dt
    description: 'P2P trade creation date (Europe/Moscow timezone)'
    data_type: date
  - name: completed_at
    description: 'P2P trade completion timestamp (Europe/Moscow timezone)'
    data_type: timestamp
  - name: completed_dt
    description: 'P2P trade completion date (Europe/Moscow timezone)'
    data_type: date
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
