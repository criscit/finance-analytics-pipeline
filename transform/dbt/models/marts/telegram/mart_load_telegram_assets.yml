version: 2
models:
- name: mart_load_telegram_assets
  description: 'Mart table for Telegram wallet asset balances with parsed numeric
    values. Contains current cryptocurrency holdings with USD valuations and 24h price
    changes.

    '
  tags:
  - mart
  - telegram
  - snapshot
  - assets
  meta:
    materialization: incremental
    incremental_strategy: delete+insert
    unique_key: asset_bk
  columns:
  - name: asset_bk
    description: 'Business key (MD5 hash) for unique identification'
    data_type: varchar(32)
    data_tests:
    - not_null
    - unique
  - name: asset_short_name
    description: 'Short name or symbol of the cryptocurrency'
    data_type: varchar(64)
  - name: price_usd
    description: 'Current USD price per unit'
    data_type: double
  - name: balance
    description: 'Asset balance in native units'
    data_type: varchar(64)
  - name: value_usd
    description: 'Total asset value in USD'
    data_type: double
  - name: processed_at
    description: 'Ingestion timestamp for incremental processing (UTC)'
    data_type: timestamp
    data_tests:
    - not_null
