version: 2

models:
  - name: core_load_telegram_assets
    description: >
      Core snapshot table for Telegram wallet asset balances with parsed numeric values.
      Contains current cryptocurrency holdings with USD valuations and 24h price changes.
    tags: [core, telegram, snapshot, assets]
    meta:
      materialization: incremental
      incremental_strategy: delete+insert
      unique_key: asset_bk

    columns:
      - name: asset_bk
        description: Business key for the asset snapshot, generated from MD5 hash of asset_short_name and parsed_at.
        data_type: varchar(32)
        data_tests:
          - not_null
          - unique

      - name: asset_full_name
        description: Full name of the cryptocurrency asset.
        data_type: varchar(128)

      - name: asset_short_name
        description: Short symbol for the cryptocurrency (e.g., BTC, TON, USDT).
        data_type: varchar(32)
        data_tests:
          - not_null

      - name: price_usd
        description: Current USD price per unit of the asset.
        data_type: double

      - name: change_24h_pct
        description: Price change percentage over the last 24 hours.
        data_type: double

      - name: balance
        description: Quantity of the asset held in the wallet.
        data_type: double

      - name: value_usd
        description: Total USD value of the asset holdings (balance * price_usd).
        data_type: double
