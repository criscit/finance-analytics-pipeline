version: 2

models:
  - name: core_load_bakai_transactions
    description: >
      Core fact table for bank transactions with business key and incremental processing.
      This table contains the main transaction data with a composite business key for deduplication.
    tags: [core, bakai, fact]
    meta:
      materialization: incremental
      incremental_strategy: delete+insert
      unique_key: transaction_bk

    columns:
      - name: transaction_bk
        description: Business key for the transaction, generated from MD5 hash of key fields.
        data_type: varchar(32)
        data_tests:
          - not_null
          - unique

      - name: doc_no
        description: Document number from bank export.
        data_type: varchar(32)

      - name: transacted_at_utc
        description: Timestamp of the transaction.
        data_type: timestamp
        data_tests:
          - not_null

      - name: correspondent_account
        description: Correspondent account for the transaction.
        data_type: varchar(64)

      - name: debit_amt
        description: Debit amount for the transaction.
        data_type: double

      - name: credit_amt
        description: Credit amount for the transaction.
        data_type: double

      - name: description
        description: Payment purpose/description from bank export.
        data_type: varchar(512)

      - name: exchange_rate
        description: Exchange rate applied to the transaction.
        data_type: double

      - name: processed_at
        description: Timestamp of the ingestion for incremental processing.
        data_type: timestamp
        data_tests:
          - not_null
