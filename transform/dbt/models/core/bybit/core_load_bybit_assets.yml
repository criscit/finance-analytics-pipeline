version: 2

models:
  - name: core_load_bybit_assets
    description: >
      Core snapshot table for Bybit asset balances.
      Contains current holdings across different wallets with USD valuations.
    tags: [core, bybit, snapshot, assets]
    meta:
      materialization: incremental
      incremental_strategy: delete+insert
      unique_key: asset_bk

    columns:
      - name: asset_bk
        description: Business key for the asset snapshot, generated from MD5 hash of coin and processed_at.
        data_type: varchar(32)
        data_tests:
          - not_null
          - unique

      - name: coin
        description: Cryptocurrency or asset symbol (e.g., BTC, USDT, ETH).
        data_type: varchar(64)
        data_tests:
          - not_null

      - name: equity
        description: Total equity value for the asset.
        data_type: double

      - name: free
        description: Available balance that can be used for trading.
        data_type: double

      - name: locked
        description: Balance locked in orders or other operations.
        data_type: double

      - name: usd_value
        description: Total USD equivalent value of the asset.
        data_type: double

      - name: wallet_balance
        description: Total wallet balance for the asset.
        data_type: double

      - name: processed_at
        description: Timestamp of the ingestion for incremental processing.
        data_type: timestamp
        data_tests:
          - not_null
