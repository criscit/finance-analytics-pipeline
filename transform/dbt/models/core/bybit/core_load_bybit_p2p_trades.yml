version: 2

models:
  - name: core_load_bybit_p2p_trades
    description: >
      Core fact table for Bybit P2P trades.
      Tracks peer-to-peer cryptocurrency trades with fiat currencies.
      Amounts are stored as raw varchar values for flexibility in parsing.
    tags: [core, bybit, fact, p2p]
    meta:
      materialization: incremental
      incremental_strategy: delete+insert
      unique_key: p2p_trade_bk

    columns:
      - name: p2p_trade_bk
        description: Business key for the trade, generated from MD5 hash of order_no.
        data_type: varchar(32)
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn
                warn_if: ">= 1"

      - name: qty
        description: Quantity of cryptocurrency traded (raw varchar value, e.g., "138.8078 USDT").
        data_type: varchar(64)

      - name: crypto_amt
        description: Parsed numeric amount of cryptocurrency traded.
        data_type: double

      - name: crypto_currency
        description: Currency code of cryptocurrency traded (e.g., USDT, BTC).
        data_type: varchar(16)

      - name: amount
        description: Fiat amount paid/received (raw varchar value, e.g., "12177.60 KGS").
        data_type: varchar(64)

      - name: fiat_amt
        description: Parsed numeric fiat amount paid/received.
        data_type: double

      - name: fiat_currency
        description: Fiat currency code (e.g., KGS, RUB, USD).
        data_type: varchar(16)

      - name: price
        description: Exchange rate between crypto and fiat (raw varchar value, e.g., "87.73 KGS/USDT").
        data_type: varchar(64)

      - name: price_usd
        description: Parsed numeric exchange rate value.
        data_type: double

      - name: fee
        description: Trading fee amount (raw varchar value, e.g., "0 USDT").
        data_type: varchar(64)

      - name: fee_amount
        description: Parsed numeric fee amount.
        data_type: double

      - name: fee_currency
        description: Currency code for the fee (e.g., USDT).
        data_type: varchar(16)

      - name: type
        description: Type of trade (BUY or SELL from user perspective).
        data_type: varchar(16)

      - name: status
        description: Status of the P2P trade.
        data_type: varchar(16)

      - name: executed_at_utc
        description: Timestamp when the trade was executed.
        data_type: timestamp

      - name: processed_at
        description: Timestamp of the ingestion for incremental processing.
        data_type: timestamp
        data_tests:
          - not_null
