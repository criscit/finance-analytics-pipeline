version: 2

models:
  - name: core_load_binance_convert_trades
    description: >
      Core fact table for Binance convert trades with parsed timestamps and numeric values.
      Tracks instant cryptocurrency conversion transactions.
    tags: [core, binance, fact, convert]
    meta:
      materialization: incremental
      incremental_strategy: delete+insert
      unique_key: convert_trade_bk

    columns:
      - name: convert_trade_bk
        description: Business key for the trade, generated from MD5 hash of order_id.
        data_type: varchar(32)
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn
                warn_if: ">= 1"

      - name: quote_id
        description: Quote identifier for the conversion rate.
        data_type: varchar(64)

      - name: created_at
        description: Timestamp when the convert trade was executed (converted from milliseconds).
        data_type: timestamp

      - name: from_amt
        description: Amount of source cryptocurrency converted.
        data_type: double

      - name: from_asset
        description: Source cryptocurrency symbol.
        data_type: varchar(32)

      - name: to_amt
        description: Amount of target cryptocurrency received.
        data_type: double

      - name: to_asset
        description: Target cryptocurrency symbol.
        data_type: varchar(32)

      - name: ratio
        description: Conversion ratio from source to target.
        data_type: double

      - name: inverse_ratio
        description: Inverse conversion ratio (target to source).
        data_type: double

      - name: order_status
        description: Status of the convert order (e.g., SUCCESS, FAILED).
        data_type: varchar(32)

      - name: order_type
        description: Type of convert order.
        data_type: varchar(32)

      - name: side
        description: Direction of conversion.
        data_type: varchar(16)

      - name: wallet_type
        description: Wallet type used for conversion (e.g., SPOT).
        data_type: varchar(32)

      - name: processed_at
        description: Timestamp of the ingestion for incremental processing.
        data_type: timestamp
        data_tests:
          - not_null
