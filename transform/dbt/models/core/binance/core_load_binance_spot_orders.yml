version: 2

models:
  - name: core_load_binance_spot_orders
    description: >
      Core fact table for Binance spot order executions with parsed amounts and prices.
      Contains order execution details for spot market trades.
    tags: [core, binance, fact, spot_orders]
    meta:
      materialization: incremental
      incremental_strategy: delete+insert
      unique_key: spot_order_bk

    columns:
      - name: spot_order_bk
        description: Business key for the order, generated from MD5 hash of order_no.
        data_type: varchar(32)
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn
                warn_if: ">= 1"

      - name: pair
        description: Trading pair symbol in lowercase (e.g., btcusdt, ethusdt).
        data_type: varchar(16)

      - name: order_price
        description: Limit price set for the order.
        data_type: double

      - name: order_amt
        description: Quantity ordered.
        data_type: double

      - name: executed_amt
        description: Quantity actually filled/executed.
        data_type: double

      - name: average_price
        description: Average execution price across all fills.
        data_type: double

      - name: trading_total
        description: Total value of the trade (executed_amount * average_price).
        data_type: double

      - name: order_amt_currency
        description: Currency code extracted from order amount (e.g., BTC, ETH).
        data_type: varchar(16)

      - name: executed_amt_currency
        description: Currency code extracted from executed amount (e.g., BTC, ETH).
        data_type: varchar(16)

      - name: average_price_currency
        description: Currency code extracted from average price (e.g., USDT, RUB).
        data_type: varchar(16)

      - name: trading_total_currency
        description: Currency code extracted from trading total (e.g., RUB, USDT).
        data_type: varchar(16)

      - name: order_type
        description: Type of order (e.g., Limit, Market, Stop-Limit).
        data_type: varchar(16)

      - name: order_side
        description: Order side (Buy or Sell).
        data_type: varchar(16)

      - name: order_status
        description: Status of the order (e.g., Filled, Partially Filled, Cancelled).
        data_type: varchar(16)

      - name: order_placed_at_utc
        description: Timestamp when the order was placed (UTC).
        data_type: timestamp

      - name: executed_at_utc
        description: Timestamp when the order was executed (UTC).
        data_type: timestamp

      - name: processed_at
        description: Timestamp of the ingestion for incremental processing.
        data_type: timestamp
        data_tests:
          - not_null
