version: 2

models:
  - name: stg_load_bybit_p2p_trades
    description: >
      Staging over prod_raw.bybit_p2p_trades using seed-based column mapping.
    tags: [staging, bybit]
    meta:
      source_table: prod_raw.bybit_p2p_trades
      seed_name: bybit_p2p_trades

    columns:
      - name: __load_key
        description: Load key for the P2P trade record.
        data_type: varchar(32)
        data_tests: [not_null, unique]

      - name: qty
        description: Crypto quantity filled in the P2P trade (raw varchar value).
        data_type: varchar(64)

      - name: amount
        description: Fiat amount exchanged in the trade (raw varchar value).
        data_type: varchar(64)

      - name: price
        description: Executed price for the trade (raw varchar value).
        data_type: varchar(64)

      - name: fee
        description: Fee charged on the trade (raw varchar value).
        data_type: varchar(64)

      - name: type
        description: Trade direction (BUY or SELL).
        data_type: varchar(16)

      - name: status
        description: Current status of the P2P order (e.g., Completed, Cancelled).
        data_type: varchar(16)

      - name: executed_at
        description: Execution timestamp of the trade.
        data_type: timestamp

      - name: order_no
        description: Bybit P2P order identifier.
        data_type: varchar(64)

      - name: processed_at
        description: Timestamp of the ingestion.
        data_type: timestamp
        data_tests:
          - not_null
