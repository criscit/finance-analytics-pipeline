version: 2

models:
  - name: stg_load_bybit_withdrawals
    description: >
      Staging over prod_raw.bybit_withdrawals using seed-based column mapping.
    tags: [staging, bybit]
    meta:
      source_table: prod_raw.bybit_withdrawals
      seed_name: bybit_withdrawals

    columns:
      - name: __load_key
        description: Load key for the withdrawal record.
        data_type: varchar(32)
        data_tests: [not_null, unique]

      - name: amount
        description: Withdrawal amount debited from Bybit.
        data_type: double

      - name: chain
        description: Blockchain network used for the withdrawal.
        data_type: varchar(32)

      - name: coin
        description: Coin symbol for the withdrawal.
        data_type: varchar(32)

      - name: created_at
        description: Timestamp when the withdrawal request was created (UTC).
        data_type: timestamp

      - name: status
        description: Current status of the withdrawal.
        data_type: varchar(32)

      - name: tag
        description: Destination tag or memo if applicable.
        data_type: varchar(64)

      - name: tax
        description: Tax amount applied to the withdrawal.
        data_type: double

      - name: tax_rate
        description: Tax rate applied to the withdrawal.
        data_type: double

      - name: tax_type
        description: Tax classification provided by Bybit.
        data_type: varchar(32)

      - name: to_address
        description: Destination blockchain address.
        data_type: varchar(256)

      - name: tx_id
        description: Blockchain transaction identifier.
        data_type: varchar(128)

      - name: updated_at
        description: Timestamp of the latest status update (UTC).
        data_type: timestamp

      - name: withdraw_fee
        description: Fee charged for the withdrawal.
        data_type: double

      - name: withdraw_id
        description: Bybit withdrawal identifier.
        data_type: varchar(64)

      - name: withdraw_type
        description: Withdrawal type classification.
        data_type: varchar(32)

      - name: processed_at
        description: Timestamp of the ingestion.
        data_type: timestamp
        data_tests:
          - not_null
