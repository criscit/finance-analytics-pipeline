version: 2

models:
  - name: stg_load_bakai_transactions
    description: >
      Staging over prod_raw.bakai_transactions using seed-based column mapping.
    tags: [staging, bakai]
    meta:
      source_table: prod_raw.bakai_transactions
      seed_name: bakai

    columns:
      - name: __load_key
        description: Load key for the transaction.
        data_type: varchar(32)
        data_tests: [not_null, unique]

      - name: doc_no
        description: Document number from bank export.
        data_type: varchar(32)

      - name: transacted_at_utc
        description: Timestamp of the transaction.
        data_type: timestamp
        data_tests:
          - not_null

      - name: correspondent_account
        description: Correspondent account for the transaction.
        data_type: varchar(64)

      - name: debit_amt
        description: Debit amount for the transaction.
        data_type: double

      - name: credit_amt
        description: Credit amount for the transaction.
        data_type: double

      - name: description
        description: Payment purpose/description from bank export.
        data_type: varchar(512)

      - name: exchange_rate
        description: Exchange rate applied to the transaction.
        data_type: double

      - name: processed_at
        description: Timestamp of the ingestion.
        data_type: timestamp
        data_tests:
          - not_null
