version: 2

models:
  - name: stg_load_binance_convert_trades
    description: >
      Staging over prod_raw.binance_convert_trades using seed-based column mapping.
    tags: [staging, binance]
    meta:
      source_table: prod_raw.binance_convert_trades
      seed_name: binance_convert_trades

    columns:
      - name: __load_key
        description: Load key for the convert trade record.
        data_type: varchar(32)
        data_tests: [not_null, unique]

      - name: created_at
        description: Creation timestamp of the convert trade (UTC).
        data_type: timestamp

      - name: from_amt
        description: Quantity of the asset sold in the conversion.
        data_type: double

      - name: from_asset
        description: Asset symbol that was converted from.
        data_type: varchar(32)

      - name: inverse_ratio
        description: Inverse conversion ratio provided by Binance.
        data_type: double

      - name: order_id
        description: Binance identifier of the convert order.
        data_type: varchar(64)

      - name: order_status
        description: Binance convert order status.
        data_type: varchar(32)

      - name: order_type
        description: Binance convert order type.
        data_type: varchar(32)

      - name: quote_id
        description: Identifier of the conversion quote.
        data_type: varchar(64)

      - name: ratio
        description: Forward conversion ratio between assets.
        data_type: double

      - name: side
        description: Conversion direction (BUY or SELL).
        data_type: varchar(16)

      - name: to_amt
        description: Quantity of the asset purchased in the conversion.
        data_type: double

      - name: to_asset
        description: Asset symbol that was converted to.
        data_type: varchar(32)

      - name: wallet_type
        description: Binance wallet type where the trade executed.
        data_type: varchar(32)

      - name: processed_at
        description: Timestamp of the ingestion.
        data_type: timestamp
        data_tests:
          - not_null
