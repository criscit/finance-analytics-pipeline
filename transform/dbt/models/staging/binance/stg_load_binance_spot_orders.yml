version: 2

models:
  - name: stg_load_binance_spot_orders
    description: >
      Staging over prod_raw.binance_spot_orders using seed-based column mapping.
    tags: [staging, binance]
    meta:
      source_table: prod_raw.binance_spot_orders
      seed_name: binance_spot_orders

    columns:
      - name: __load_key
        description: Load key for the spot order record.
        data_type: varchar(32)
        data_tests: [not_null, unique]

      - name: order_no
        description: Binance spot order identifier.
        data_type: varchar(64)

      - name: pair
        description: Trading pair symbol (e.g., BTCUSDT).
        data_type: varchar(16)

      - name: order_type
        description: Spot order type (e.g., Limit, Market).
        data_type: varchar(16)

      - name: order_side
        description: Spot order side (BUY or SELL).
        data_type: varchar(16)

      - name: order_price
        description: Submitted order price.
        data_type: double

      - name: order_amt
        description: Submitted base asset quantity with currency (e.g., "0.00139BTC").
        data_type: varchar(64)

      - name: executed_amt
        description: Executed base asset quantity with currency (e.g., "0.00139BTC").
        data_type: varchar(64)

      - name: average_price
        description: Average execution price.
        data_type: double

      - name: trading_total
        description: Total traded quote quantity with currency (e.g., "5907.5RUB").
        data_type: varchar(64)

      - name: order_status
        description: Current status of the spot order (e.g., FILLED, PARTIALLY_FILLED, CANCELLED).
        data_type: varchar(16)

      - name: order_placed_at_utc
        description: Order submission timestamp (UTC).
        data_type: timestamp

      - name: executed_at_utc
        description: Final execution timestamp (UTC).
        data_type: timestamp

      - name: processed_at
        description: Timestamp of the ingestion.
        data_type: timestamp
        data_tests:
          - not_null
