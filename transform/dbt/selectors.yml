# file: transform/dbt/selectors.yml
# Centralized selectors for clean orchestration

selectors:
  # Bank sources
  - name: run_t_bank_transactions
    definition:
      intersection:
        - union:
          - method: source
            value: t_bank.transactions
            children: true
          - method: resource_type
            value: seed
        - exclude:
          - method: config.schema
            value: imart

